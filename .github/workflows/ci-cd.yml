run-name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths: 
      - 'backend/**'

  pull_request:
    paths:
      - 'backend/**'

  workflow_dispatch:
    
jobs:
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci

  backend-cd:
    needs: backend-ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Render deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOYMENT_WEBHOOK_URL }}"