services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quit-it-backend

    ports:
      - "8080:8080"

    env_file:
      - .env

    depends_on:
      - redis

    restart: unless-stopped

    environment:
      NODE_ENV: production

  redis:
    image: redis:7-alpine
    container_name: quit-it-redis

    volumes:
      - redis_data:/data
      
    restart: unless-stopped

volumes:
  redis_data: